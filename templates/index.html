<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">File Search Tool</h1>
        <form action="/search" method="post" class="p-4 bg-white rounded shadow">
            <div class="mb-3">
                <label for="coupon_rate" class="form-label">Coupon Rate</label>
                <input type="text" name="coupon_rate" id="coupon_rate" class="form-control" placeholder="Enter Coupon Rate">
            </div>
            <div class="mb-3">
                <label for="company_name" class="form-label">Issuer Name</label>
                <input type="text" name="company_name" id="company_name" class="form-control" placeholder="Enter Issuer Name">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>
    </div>
</body>
</html>
